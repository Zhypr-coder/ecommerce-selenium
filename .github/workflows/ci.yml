name: Selenium Test CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *'   # optional: nightly run at 2 AM UTC

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'          # speeds up repeat runs by caching dependencies

      - name: Run Selenium tests
        run: mvn clean test -Dbrowser=chrome
        continue-on-error: true   # let the pipeline continue to reporting even if tests fail

      - name: Generate Allure report
        run: mvn allure:report
        if: always()

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/

      - name: Upload Surefire results (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
